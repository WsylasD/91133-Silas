<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cad-style.css">
    <title>Cadastro - Produtos</title>
</head>
<body>
    <h1>Sistema CadProd - 1.0</h1>
    <h2>Tela de Cadastro</h2>

    <p>Usuário:</p>
    <div class="container">
        <form action="">

            <label for="">Produto</label>
            <input type="text" name="product" id="product" placeholder="Nome do Produto">
    
            <label for="">Preço</label>
            <input type="number" name="price" id="price" placeholder="Informe o Valor">

            <label for="">Quantidade</label>
            <input type="text" name="amount" id="amount" placeholder="Informe a Quantidade">
    
            <label for="">Total</label>
            <span id="total-valor"> 0 </span>
    
            <div class="bt-submit">
                <input type="submit" value="Cadastrar">
            </div>
    
        </form>
    </div>
</body>
</html>
