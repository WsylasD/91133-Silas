<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema - CadProd</title>
</head>
<body>
    <h1>Sistema CadProd - 1.0</h1>
    <div class="container">
        <form id="loginform" class="loginform">

            <label for="">Username</label>
            <input type="text" name="username" id="username" placeholder="Informe o Usuário">
    
            <label for="">Password</label>
            <input type="password" name="password" id="password" placeholder="Informe a Senha">
    
            <div class="bt-submit">
                <input type="submit" value="Entrar">
            </div>
    
        </form>
        <p id="msgErro" class="erro" style="color: red;"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
